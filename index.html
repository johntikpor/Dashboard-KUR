<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#16294a;--mut:#74839a;--line:#e6ebf2;--ok:#e1f5e8;--okt:#1c6a37;--bad:#fde4e4;--badt:#a01f1f;--mid:#fff0c8;--midt:#8a5a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1626;--card:#16223a;--ink:#e6ecf7;--mut:#8da0bb;--line:#26344f;--ok:#17402b;--okt:#86e3a8;--bad:#44212a;--badt:#ff9d9d;--mid:#3c3216;--midt:#f3d17f}}
:root[data-theme=dark]{--bg:#0e1626;--card:#16223a;--ink:#e6ecf7;--mut:#8da0bb;--line:#26344f;--ok:#17402b;--okt:#86e3a8;--bad:#44212a;--badt:#ff9d9d;--mid:#3c3216;--midt:#f3d17f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.w{max-width:1280px;margin:auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.lg{background:#fff;border-radius:16px;padding:8px 16px}.lg img{height:52px;display:block}
header div:nth-child(2){flex:1;min-width:220px}h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}header p{margin:2px 0 0;color:var(--mut)}
.btn{cursor:pointer;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700}.btn:focus-within{outline:2px solid #2bb3a3;outline-offset:2px}
.f{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:var(--card);padding:12px 16px;border-radius:16px;box-shadow:0 4px 16px #16294a1f;margin:16px 0}
label{font-size:11.5px;color:var(--mut);display:grid;gap:3px;font-weight:600}
select,input{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}input[type=number]{width:160px}
select:focus-visible,input:focus-visible{outline:2px solid #2bb3a3}
.hero{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:1px;background:#0c2748;border-radius:22px;overflow:hidden;color:#fff}
.hero>div{padding:22px 24px;background:#123a66;display:grid;align-content:space-between;gap:8px}.hero .h1{background:#1e5a8a}
.hero b{font-size:26px;line-height:1.1;font-weight:800}.hero .h1 b{font-size:clamp(34px,5.4vw,58px);letter-spacing:-.03em}.hero small{font-size:.4em;font-weight:600}
.hero span,.hero em{opacity:.78;font-style:normal;font-size:12.5px}
@media(max-width:860px){.hero{grid-template-columns:1fr 1fr}.hero .h1{grid-column:1/-1}}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.c{background:var(--card);border-radius:18px;padding:18px;margin-top:16px;min-width:0;box-shadow:0 1px 2px #16294a14}
.g>.c{margin-top:0}.g{margin-top:16px}
h2{font-size:15px;margin:0 0 12px;font-weight:700}.cv{height:270px;position:relative}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{color:var(--mut);font-size:11.5px;font-weight:600;padding:8px;text-align:right;border-bottom:2px solid var(--line)}td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}
.l{text-align:left;font-weight:600;white-space:normal;min-width:90px}.tot td{background:var(--bg);font-weight:700}.kcp td{color:var(--mut);font-style:italic}
.p{padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--bg)}.G{background:var(--ok);color:var(--okt)}.Y{background:var(--mid);color:var(--midt)}.R{background:var(--bad);color:var(--badt)}
.bc{display:flex;align-items:center;gap:8px;justify-content:flex-end}.bar{width:56px;height:6px;background:var(--line);border-radius:4px}.bar i{display:block;height:100%;background:#2bb3a3;border-radius:4px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}.chips div{background:var(--bg);border-radius:14px;padding:12px 14px;display:grid}
.chips b{font-size:20px}.chips span,.chips em{color:var(--mut);font-style:normal;font-size:12px}
.n{color:var(--mut);font-size:12px;margin:10px 0 0}
